name: patrol_workspace
publish_to: none

environment:
  sdk: ">=3.8.0 <4.0.0"

workspace:
  - packages/adb
  - packages/patrol
  - packages/patrol_cli
  - packages/patrol_finders
  - packages/patrol_gen
  - packages/patrol_log

dev_dependencies:
  melos: ^7.0.0

  flutter_test: any
  patrol: any
  test_api: any
melos:
  repository: https://github.com/leancodepl/patrol

  scripts:
    lint:all:
      run: melos run analyze && melos run format-check
      description: Run all static analysis checks.

    get:all:
      run: melos exec -- \
        flutter pub get
      description: Run `flutter pub get` for all packages.

    analyze:
      run: |
        melos exec -- \
          flutter analyze --fatal-infos
      description: Run `flutter analyze` for all packages.

    format:
      run: melos exec -- \
        dart format .
      description: Run `dart format` for all packages.

    format-check:
      run: melos exec -- \
        dart format . --set-exit-if-changed
      description: Run `dart format` checks for all packages.

    test:
      run: melos exec -- flutter test .
      packageFilters:
        dirExists:
          - "test"
      description: Run `flutter test` for selected packages.

dependency_overrides:
  analyzer: ^8.0.0

